name: Refresh live-site teasers

# Every Sunday 07:00 UTC — re-captures ibmathrevision.com and
# alevelmathrevision.com hero screenshots and commits them back so the
# mathrevision.co.uk "A peek at the real thing" cards always show the
# current state of both live sites.

on:
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-teasers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Capture teasers
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');
          const shots = [
            { url: 'https://ibmathrevision.com/',              out: 'img/teaser-ib.jpg' },
            { url: 'https://alevelmathrevision.com/',          out: 'img/teaser-alevel.jpg' },
            { url: 'https://ibmathrevision.com/practice.html', out: 'img/feature-practice.jpg' },
            { url: 'https://ibmathrevision.com/path-to-7.html',out: 'img/feature-path-to-7.jpg' },
            { url: 'https://ibmathrevision.com/jeopardy.html', out: 'img/feature-live-game.jpg' },
          ];
          (async () => {
            const browser = await chromium.launch();
            const ctx = await browser.newContext({ viewport: { width: 1400, height: 900 } });
            const page = await ctx.newPage();
            for (const s of shots) {
              try {
                await page.goto(s.url, { waitUntil: 'networkidle', timeout: 30000 });
                await page.waitForTimeout(1500);
                await page.screenshot({ path: s.out, quality: 70, type: 'jpeg', fullPage: false });
                console.log('captured', s.url, '→', s.out);
              } catch (e) {
                console.error('failed', s.url, e.message);
                process.exitCode = 1;
              }
            }
            await browser.close();
          })();
          NODE

      - name: Commit refreshed teasers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img/teaser-ib.jpg img/teaser-alevel.jpg img/feature-practice.jpg img/feature-path-to-7.jpg img/feature-live-game.jpg
          git diff --quiet --cached || git commit -m "chore: refresh live-site + feature teaser screenshots"
          git push
